name: Deploy Site to GitHub Pages

# 官网（website/home，React+antd）部署在站点根路径，
# 教学文档站（website/docs，VitePress）部署在 /docs/ 子路径。
on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

# 允许 GitHub Pages 读取本仓库内容
permissions:
  contents: read
  pages: write
  id-token: write

# 同一分支并发部署只保留最新一次
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            website/home/package-lock.json
            website/package-lock.json

      # --- 官网（React + antd，部署到根路径） ---
      - name: Install home dependencies
        working-directory: website/home
        run: npm ci

      - name: Build home site
        working-directory: website/home
        run: npm run build

      # --- 教学文档站（VitePress，部署到 /docs/ 子路径） ---
      - name: Install docs dependencies
        working-directory: website
        run: npm ci

      - name: Build VitePress docs
        working-directory: website
        run: npm run build

      # --- 组合：官网占根，教学站入 docs/ ---
      - name: Assemble site
        run: |
          mkdir -p site/docs
          cp -r website/home/dist/* site/
          cp -r website/docs/.vitepress/dist/* site/docs/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
